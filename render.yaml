# Render one-click deploy: https://render.com/deploy?repo=https://github.com/ibalajisivarajan/focus-desk
# Render reads this Blueprint, provisions a FREE web service, and prompts for
# the Turso credentials below (sync: false). Data lives in Turso's free cloud
# database, so it persists even though the free web service has no disk.
services:
  - type: web
    name: focus-desk
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Render injects PORT automatically at runtime; the server reads it.
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
